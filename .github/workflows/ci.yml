name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test
        run: python -m pytest
      - name: Run the example suite against the recorded responses
        run: |
          python -m prompt_regression_harness validate examples/support-suite.json
          python -m prompt_regression_harness checks
          python -m prompt_regression_harness run examples/support-suite.json --fixtures examples/recorded.json
      - name: Prove a regression is caught
        run: |
          set +e
          python -m prompt_regression_harness run examples/support-suite.json \
            --fixtures examples/recorded-before-fix.json --baseline examples/baseline.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then echo "expected exit code 1"; exit 1; fi
